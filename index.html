
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumen House</title>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17324d">
<link rel="icon" type="image/svg+xml" href="icon.svg">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f6f9;
      margin: 0;
      color: #243447;
    }
    header {
      background: #17324d;
      color: white;
      padding: 28px 20px;
      text-align: center;
    }
    header h1 { margin: 0 0 8px; }
    main {
      max-width: 650px;
      margin: auto;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 2px 10px #00000010;
    }
    .card h2 { margin-top: 0; }
    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    button {
      padding: 15px 8px;
      border: none;
      border-radius: 9px;
      background: #176ca0;
      color: white;
      font-size: 14px;
    }
    .note {
      font-size: 13px;
      color: #667788;
    }
  </style>
</head>
<body>
  <header>
    <h1>Lumen House</h1>
    <div>Control y monitorización</div>
  </header>

  <main>
    <section class="card">
      <h2>🌡️ Aerotermia Samsung</h2>
      <p>Temperatura actual: -- °C</p>
      <p>Temperatura objetivo: -- °C</p>
      
<div class="buttons">
  <button onclick="ejecutar('activar')">
    Activar avisos
  </button>
  <button onclick="ejecutar('desactivar')">
    Desactivar avisos
  </button>
  <button onclick="ejecutar('comprobar')">
    Comprobar ACS
  </button>
  <button onclick="ejecutar('consultar_temperatura')">
    Consultar temperatura
  </button>
</div>

<p id="resultado" role="status" aria-live="polite"></p>


      <p class="note">
        Controles pendientes de conectar con GitHub.
      </p>
    </section>

    <section class="card">
      <h2>🌊 Temperatura del mar</h2>
      <h3>El Port de la Selva</h3>
      <p>Temperatura actual: -- °C</p>
      <p>Gráfico histórico: pendiente de conectar.</p>
    </section>
  </main>
  
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker
        .register("./sw.js")
        .then(() => console.log("Lumen House PWA activa"))
        .catch(error => console.error("Error PWA:", error));
    });
  }
</script>

<script>
const API_URL =
  "https://lumen-house-api.st08280.workers.dev/api/acs";

async function ejecutar(accion) {
  const resultado = document.getElementById("resultado");

  const clave = prompt(
    "Introduce la clave de acceso de Lumen House:"
  );

  if (clave === null) return;

  if (!clave) {
    resultado.textContent = "Debes introducir la clave.";
    return;
  }

  resultado.textContent = "Enviando solicitud...";

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + clave
      },
      body: JSON.stringify({ accion })
    });

    const data = await response.json();

    if (!response.ok) {
      resultado.textContent =
        data.error || "Error al ejecutar la rutina.";
      return;
    }

    resultado.textContent =
      "Solicitud enviada: " + accion;

  } catch (error) {
    resultado.textContent =
      "No se ha podido conectar con Cloudflare.";
  }
}
</script>

  
</body>
</html>

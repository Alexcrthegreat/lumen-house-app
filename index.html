
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumen House</title>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17324d">
<link rel="icon" type="image/svg+xml" href="icon.svg">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f6f9;
      margin: 0;
      color: #243447;
    }
    header {
      background: #17324d;
      color: white;
      padding: 28px 20px;
      text-align: center;
    }
    header h1 { margin: 0 0 8px; }
    main {
      max-width: 650px;
      margin: auto;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 2px 10px #00000010;
    }
    .card h2 { margin-top: 0; }
    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    button {
      padding: 15px 8px;
      border: none;
      border-radius: 9px;
      background: #176ca0;
      color: white;
      font-size: 14px;
    }
    .note {
      font-size: 13px;
      color: #667788;
    }
  </style>
</head>
<body>
  <header>
    <h1>Lumen House</h1>
    <div>Control y monitorización</div>
  </header>

  <main>
    <section class="card">
      <h2>🌡️ Aerotermia Samsung</h2>
      <p>Temperatura actual:
  <strong id="temp-actual">-- °C</strong>
</p>

<p>Temperatura objetivo:
  <strong id="temp-objetivo">-- °C</strong>
</p>

<button id="btn-temperaturas" onclick="actualizarTemperaturas()">
  🌡️ Actualizar temperaturas
</button>

<p id="estado-temperaturas" role="status" aria-live="polite"></p>
<p id="fecha-temperaturas" class="note"></p>
      
<div class="buttons">
  <button onclick="ejecutar('activar')">
    Activar avisos
  </button>
  <button onclick="ejecutar('desactivar')">
    Desactivar avisos
  </button>
  <button onclick="ejecutar('comprobar')">
    Comprobar ACS
  </button>
  <button onclick="ejecutar('consultar_temperatura')">
    Consultar temperatura
  </button>
</div>

<p id="resultado" role="status" aria-live="polite"></p>
<button onclick="cerrarSesion()">
  Cerrar sesión
</button>

      <p class="note">
        Controles pendientes de conectar con GitHub.
      </p>
    </section>

    <section class="card">
      <h2>🌊 Temperatura del mar</h2>
      <h3>El Port de la Selva</h3>
      <p>Temperatura actual: -- °C</p>
      <p>Gráfico histórico: pendiente de conectar.</p>
    </section>
  </main>
  
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker
        .register("./sw.js")
        .then(() => console.log("Lumen House PWA activa"))
        .catch(error => console.error("Error PWA:", error));
    });
  }
</script>

<script>
const API_URL =
  "https://lumen-house-api.st08280.workers.dev/api/acs";

function obtenerClave() {
  let clave = localStorage.getItem("lumen_house_key");

  if (!clave) {
    clave = prompt("Introduce la clave de acceso de Lumen House:");

    if (!clave) return null;

    localStorage.setItem("lumen_house_key", clave);
  }

  return clave;
}

function cerrarSesion() {
  localStorage.removeItem("lumen_house_key");
  alert("Clave eliminada de este dispositivo.");
}

  
async function ejecutar(accion) {
  const resultado = document.getElementById("resultado");

  const clave = obtenerClave();
  if (!clave) return;

  if (clave === null) return;

  if (!clave) {
    resultado.textContent = "Debes introducir la clave.";
    return;
  }

  resultado.textContent = "Enviando solicitud...";

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + clave
      },
      body: JSON.stringify({ accion })
    });

    const data = await response.json();

    if (!response.ok) {
      resultado.textContent =
        data.error || "Error al ejecutar la rutina.";
      return;
    }

    resultado.textContent =
      "Solicitud enviada: " + accion;

  } catch (error) {
    resultado.textContent =
      "No se ha podido conectar con Cloudflare.";
  }
}
  
async function actualizarTemperaturas() {
  const estado = document.getElementById("estado-temperaturas");
  const boton = document.getElementById("btn-temperaturas");

  const clave = obtenerClave();
  if (!clave) return;

  if (clave === null) return;

  if (!clave) {
    estado.textContent = "Debes introducir la clave.";
    return;
  }

  boton.disabled = true;
  estado.textContent = "Consultando SmartThings...";

  try {
    const response = await fetch(
      "https://lumen-house-api.st08280.workers.dev/api/temperaturas",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + clave
        },
        body: JSON.stringify({})
      }
    );

    const data = await response.json();

    if (!response.ok) {
      estado.textContent =
        data.error || "Error al consultar temperaturas.";
      return;
    }

    document.getElementById("temp-actual").textContent =
      Number(data.actual).toFixed(1) + " °C";

    document.getElementById("temp-objetivo").textContent =
      Number(data.objetivo).toFixed(1) + " °C";

    document.getElementById("fecha-temperaturas").textContent =
      "Consulta: " + new Date(data.fecha).toLocaleString("es-ES");

    estado.textContent = "Temperaturas consultadas correctamente.";

  } catch (error) {
    estado.textContent =
      "No se ha podido conectar con Cloudflare.";
  } finally {
    boton.disabled = false;
  }
}

</script>

  
</body>
</html>

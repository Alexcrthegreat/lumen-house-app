
name: GoodWe - Prueba autenticacion

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-login:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Comprobar autenticacion GoodWe
        env:
          GOODWE_USER: ${{ secrets.GOODWE_USER }}
          GOODWE_PASSWORD: ${{ secrets.GOODWE_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import hashlib
          import base64
          import urllib.request
          import urllib.error

          user = os.environ["GOODWE_USER"]
          password = os.environ["GOODWE_PASSWORD"]

          md5_hex = hashlib.md5(
              password.encode("utf-8")
          ).hexdigest()

          encoded_password = base64.b64encode(
              md5_hex.encode("utf-8")
          ).decode("ascii")

          payload = {
              "account": user,
              "pwd": encoded_password,
              "agreement": 1,
              "isChinese": False,
              "isLocal": False
          }

          url = (
              "https://eu-semsplus.goodwe.com"
              "/web/sems/sems-user/api/v1/auth/cross-login"
          )

          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(
                  request, timeout=25
              ) as response:
                  result = json.load(response)

              if result.get("code") == "00000" and result.get("data", {}).get("token"):
                  print("GOODWE LOGIN: CORRECTO")
              else:
                  print("GOODWE LOGIN: NO VALIDADO")
                  print("Codigo:", str(result.get("code", "sin codigo"))[:40])
                  print("Descripcion:", str(result.get("description", "sin descripcion"))[:200])
                  raise SystemExit(1)

          except urllib.error.HTTPError as error:
              print("GOODWE LOGIN: ERROR HTTP", error.code)
              raise SystemExit(1)
          except Exception as error:
              print("GOODWE LOGIN: ERROR", type(error).__name__)
              raise SystemExit(1)
          PY

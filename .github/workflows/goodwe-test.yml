
name: GoodWe - Prueba autenticacion

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-login:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Comprobar autenticacion GoodWe
        env:
          GOODWE_USER: ${{ secrets.GOODWE_USER }}
          GOODWE_PASSWORD: ${{ secrets.GOODWE_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import hashlib
          import base64
          import time
          import uuid
          import urllib.request
          import urllib.error

          user = os.environ["GOODWE_USER"]
          password = os.environ["GOODWE_PASSWORD"]

          if not user or not password:
              print("ERROR: faltan credenciales GoodWe")
              raise SystemExit(1)

          # Transformacion de la contraseña observada en SEMS+
          md5_hex = hashlib.md5(
              password.encode("utf-8")
          ).hexdigest()

          encoded_password = base64.b64encode(
              md5_hex.encode("utf-8")
          ).decode("ascii")

          # Token inicial previo al login
          token_inicial = {
              "uid": "",
              "timestamp": 0,
              "token": "",
              "client": "semsPlusWeb",
              "version": "",
              "language": "en"
          }

          token_json = json.dumps(
              token_inicial,
              separators=(",", ":"),
              ensure_ascii=False
          )

          # X-Signature:
          # Base64(SHA256(timestamp@uid@token)@timestamp)
          timestamp = str(int(time.time() * 1000))

          texto_firma = f"{timestamp}@@"

          hash_firma = hashlib.sha256(
              texto_firma.encode("utf-8")
          ).hexdigest()

          signature = base64.b64encode(
              f"{hash_firma}@{timestamp}".encode("utf-8")
          ).decode("ascii")

          # Identificador generado para la peticion
          request_uuid = str(uuid.uuid4())

          payload = {
              "account": user,
              "pwd": encoded_password,
              "agreement": 1,
              "isChinese": False,
              "isLocal": False
          }

          url = (
              "https://eu-semsplus.goodwe.com"
              "/web/sems/sems-user/api/v1/auth/cross-login"
          )

          headers = {
              "Content-Type": "application/json",
              "Accept": "application/json, text/plain, */*",
              "Token": token_json,
              "Uuid": request_uuid,
              "X-Signature": signature,
              "Currentlang": "en",
              "Neutral": "0",
              "Origin": "https://eu-semsplus.goodwe.com",
              "Referer": "https://eu-semsplus.goodwe.com/",
              "Os": "Windows 10.0 desktop",
              "Brand": "Chrome 153.0.0.0 Google Inc. es-ES Europe/Madrid",
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/153.0.0.0 Safari/537.36"
              )
          }

          request = urllib.request.Request(
              url,
              data=json.dumps(
                  payload,
                  separators=(",", ":")
              ).encode("utf-8"),
              headers=headers,
              method="POST"
          )

          print("Iniciando autenticacion GoodWe...")
          print("Token inicial generado: SI")
          print("X-Signature generada: SI")
          print("Uuid generado: SI")

          try:
              with urllib.request.urlopen(
                  request, timeout=25
              ) as response:
                  result = json.load(response)

              codigo = str(result.get("code", "sin codigo"))

              if (
                  codigo == "00000"
                  and isinstance(result.get("data"), dict)
                  and result["data"].get("token")
              ):
                  print("GOODWE LOGIN: CORRECTO")
                  print("Token de sesion recibido: SI")
                  print("UID recibido:", bool(result["data"].get("uid")))
                  print("UUID recibido:", bool(result["data"].get("uuid")))
                  print("API recibida:", bool(result["data"].get("api")))
                  # Consultar curvas de la instalación fotovoltaica
                  from datetime import datetime
                  from zoneinfo import ZoneInfo
                  
                  sesion = result["data"]
                  
                  fecha = datetime.now(
                      ZoneInfo("Europe/Madrid")
                  ).strftime("%Y-%m-%d")
                  
                  payload_solar = {
                      "stationId": "2451b310-d5f8-4cc7-8583-ce92b7e25c31",
                      "items": [
                          "pSystem",
                          "pConsum",
                          "pGrid",
                          "workStatus",
                          "gridConnStu"
                      ],
                      "timeScale": 1,
                      "timeZone": -1,
                      "startTime": fecha + " 00:00:00",
                      "endTime": fecha + " 23:59:59"
                  }
                  
                  # Utilizar los datos de la sesión autenticada
                  token_sesion = json.dumps(
                      sesion,
                      separators=(",", ":"),
                      ensure_ascii=False
                  )
                  
                  timestamp_solar = str(int(time.time() * 1000))
                  
                  texto_solar = (
                      f"{timestamp_solar}@"
                      f"{sesion['uid']}@"
                      f"{sesion['token']}"
                  )
                  
                  hash_solar = hashlib.sha256(
                      texto_solar.encode("utf-8")
                  ).hexdigest()
                  
                  firma_solar = base64.b64encode(
                      f"{hash_solar}@{timestamp_solar}".encode("utf-8")
                  ).decode("ascii")
                  
                  headers_solar = headers.copy()
                  headers_solar["Token"] = token_sesion
                  headers_solar["Uuid"] = str(sesion["uuid"])
                  headers_solar["X-Signature"] = firma_solar
                  
                  url_solar = (
                      "https://eu-gateway.semsportal.com"
                      "/web/sems/sems-plant/api/v1/hems/power/statisticsAndPreV2"
                  )
                  
                  peticion_solar = urllib.request.Request(
                      url_solar,
                      data=json.dumps(payload_solar).encode("utf-8"),
                      headers=headers_solar,
                      method="POST"
                  )
                  
                  with urllib.request.urlopen(
                      peticion_solar, timeout=30
                  ) as respuesta_solar:
                      datos_solares = json.load(respuesta_solar)
                  
                  print("GOODWE DATOS - Codigo:", datos_solares.get("code"))
                  
                  if datos_solares.get("code") == "00000":
                      series = datos_solares.get("data", {}).get("dataList", [])
                  
                      for serie in series:
                          if serie.get("item") in ("pSystem", "pConsum", "pGrid"):
                              print(
                                  serie["item"],
                                  "- registros:",
                                  len(serie.get("powerData", []))
                              )
                  else:
                      print(
                          "GOODWE DATOS - Descripcion:",
                          str(datos_solares.get("description", ""))[:150]
                      )
                      raise SystemExit(1)
              else:
                  print("GOODWE LOGIN: NO VALIDADO")
                  print("Codigo:", codigo[:40])
                  print(
                      "Descripcion:",
                      str(result.get(
                          "description",
                          "sin descripcion"
                      ))[:200]
                  )
                  raise SystemExit(1)

          except urllib.error.HTTPError as error:
              print("GOODWE LOGIN: ERROR HTTP", error.code)
              raise SystemExit(1)

          except urllib.error.URLError as error:
              print("GOODWE LOGIN: ERROR DE CONEXION")
              raise SystemExit(1)

          PY
